<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pitch da Apresentação de Fomento de Negócio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100vw; height: 100vh; height: 100dvh; background-color: #000000; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: fixed; top: 0; left: 0; }
        #screen-start { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; text-align: center; cursor: pointer; }
        #screen-start img { width: 100%; max-height: 100vh; max-height: 100dvh; object-fit: contain; display: block; }
        #slide-container { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000000; overflow: hidden; position: relative; min-height: 0; }
        #slide-img { width: 100%; height: 100%; object-fit: fill; display: block; }
        .controls { background: #0f172a; padding: 10px 8px; display: flex; gap: 6px; align-items: center; justify-content: space-between; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; flex-shrink: 0; }
        button.ctrl-btn { background-color: #1f1f1f; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 8px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; text-align: center; }
        .btn-indice { background-color: #2c1f30; color: #ff9900; border-color: #ff9900; flex: 0.7; }
        .btn-stop { background-color: #3d1212; color: #ff3333; border-color: #ff3333; flex: 0.7; }
        #counter { font-size: 14px; color: #ffffff; padding: 0 4px; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="screen-start" onclick="iniciarApp()">
        <img src="inicio.jpg" alt="Iniciar Apresentação">
    </div>
    <div id="slide-container">
        <img id="slide-img" src="" alt="Slide">
    </div>
    <div class="controls">
        <button onclick="irParaIndice()" class="ctrl-btn btn-indice">Indice</button>
        <button onclick="mudarSlide(-1)" class="ctrl-btn">Anterior</button>
        <span id="counter">1 / 62</span>
        <button onclick="mudarSlide(1)" class="ctrl-btn">Proximo</button>
        <button onclick="pararAudio()" class="ctrl-btn btn-stop">Stop</button>
    </div>
    <audio id="audio-narracao"></audio>
    <audio id="audio-fundo" loop></audio>
    <script>
        let currentSlide = 1;
        const totalSlides = 62;
        const narracoes = {4: "audios/slide 04.mp3", 6: "audios/slide 06.mp3", 7: "audios/slide 07.mp3", 8: "audios/slide 08.mp3", 9: "audios/slide 09.mp3", 10: "audios/slide 10.mp3", 11: "audios/slide 11.mp3", 12: "audios/slide 12.mp3", 13: "audios/slide 13.mp3", 14: "audios/slide 14.mp3", 15: "audios/slide 15.mp3", 16: "audios/slide 16.mp3", 17: "audios/slide 17.mp3", 18: "audios/slide 18.mp3", 19: "audios/slide 19.mp3", 20: "audios/slide 20.mp3", 21: "audios/slide 21.mp3", 22: "audios/slide 22.mp3", 31: "audios/slide 31.mp3", 45: "audios/slide 45.mp3", 55: "audios/slide 55.mp3", 56: "audios/slide 56.mp3", 57: "audios/slide 57.mp3", 58: "audios/slide 58.mp3", 59: "audios/slide 59.mp3", 60: "audios/slide 60.mp3", 61: "audios/slide 61.mp3"};
        const audioNarracao = document.getElementById("audio-narracao");
        const audioFundo = document.getElementById("audio-fundo");
        const imgElement = document.getElementById("slide-img");
        const counterElement = document.getElementById("counter");
        audioFundo.src = "audios/AUDIO.mp3";
        
        function iniciarApp() {
            let elem = document.documentElement;
            let reqFS = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
            if (reqFS) {
                reqFS.call(elem).then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock("landscape").catch(err => console.log("Rotação não suportada:", err));
                    }
                }).catch(err => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock("landscape").catch(e => {});
                    }
                });
            }
            document.getElementById("screen-start").style.display = "none";
            atualizarSlide();
        }
        
        function atualizarSlide() {
            imgElement.src = "imagens_slides/slide_" + currentSlide + ".png";
            counterElement.textContent = currentSlide + " / " + totalSlides;
            audioNarracao.pause();
            audioNarracao.currentTime = 0;
            if (currentSlide >= 1 && currentSlide <= 3) {
                audioFundo.pause();
                audioFundo.currentTime = 0;
                return;
            }
            if (narracoes[currentSlide]) {
                audioFundo.pause();
                audioNarracao.src = narracoes[currentSlide];
                audioNarracao.load();
                audioNarracao.play().catch(function(e) { console.log("Aguardando narração"); });
            } else {
                audioNarracao.pause();
                if (audioFundo.paused) {
                    audioFundo.play().catch(function(e) { console.log("Aguardando fundo"); });
                }
            }
        }
        function mudarSlide(direcao) {
            currentSlide += direcao;
            if (currentSlide > totalSlides) { currentSlide = totalSlides; }
            else if (currentSlide < 1) { currentSlide = 1; }
            atualizarSlide();
        }
        function irParaIndice() {
            currentSlide = 1;
            atualizarSlide();
        }
        function pararAudio() {
            audioNarracao.pause();
            audioNarracao.currentTime = 0;
            audioFundo.pause();
            audioFundo.currentTime = 0;
        }
    </script>
</body>
</html>
