<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Fomento de Negócio</title>
<style>
  body {
    background-color: #121218;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .link-botao {
    display: inline-block;
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .link-botao:hover {
    transform: scale(1.03); /* Dá um leve zoom elegante quando o mouse passa por cima */
    filter: brightness(1.1); /* Dá um brilho extra */
  }
  .link-botao img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0, 200, 150, 0.3);
  }
</style>
</head>
<body>

  <!-- O link abaixo envolve a sua imagem. Quando clicarem na foto, abre o destino. -->
  <a href="https://joaoamancio07.github.io/proposta-fomento-negociacao/" target="_blank" class="link-botao">
    <img src="BOTAO.jpg" alt="Pitch da Apresentação de Fomento de Negócio">
  </a>

</body>
</html>
